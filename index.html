<script>
'use strict';
const DATA=JSON.parse(document.getElementById('site-data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url=(type,id)=>'#/'+type+'/'+encodeURIComponent(id);
const main=$('#main');
let activeDomain='全部', search='';
const dateLabel=date=>date?new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(new Date(date+'T12:00:00+09:00')):'日期未标注';
const plain=s=>s.replace(/^主线[：:]\s*/,'').replace(/\*\*/g,'');
function sections(doc,term){return doc.sections.filter(s=>s.title.includes(term))}
function entries(doc,term){return sections(doc,term).flatMap(s=>s.entries)}
function firstText(doc){const s=doc.sections.find(s=>s.entries.length);return s?s.entries[s.entries.length-1].text.replace(/https?:\/\/\S+/g,'').replace(/来源[：:]?\s*$/,'').trim():plain(doc.intro)}
function sourceDetails(doc){return `<details class="source-details"><summary>查看完整源文 · ${esc(doc.id)}.md</summary><pre>${esc(doc.raw)}</pre></details>`}
function empty(title,body){return `<div class="empty"><strong>${esc(title)}</strong>${esc(body)}</div>`}
function hero(kicker,title,lead,meta=''){return `<section class="hero"><div class="eyebrow">${esc(kicker)}</div><h1>${esc(title)}</h1>${lead?`<p class="lead">${esc(lead)}</p>`:''}${meta}</section>`}
function filters(){return `<div class="filters" aria-label="领域筛选">${['全部',...DATA.domains].map(d=>`<button class="chip" data-domain="${esc(d)}" aria-pressed="${activeDomain===d}">${d}</button>`).join('')}</div>`}
function topicPreview(doc){return `<a class="topic-preview" href="${url('topic',doc.id)}"><div class="topic-title"><span>${esc(doc.title.replace(/^议题[：:]\s*/,''))}</span><span class="arrow" aria-hidden="true">↗</span></div><p>${esc(firstText(doc))}</p></a>`}
function aside(){const personal=sections(DATA.archives.find(a=>!a.weekly)||{sections:[]},'关注点');return `<aside class="aside"><section class="aside-section"><div class="aside-heading"><h2>趋势追踪</h2><a class="small-link" href="#/topics">全部 ${DATA.topics.length} 项 ↗</a></div>${DATA.topics.length?DATA.topics.slice(0,6).map(topicPreview).join(''): '<p class="small-link">议题尚未收录。</p>'}</section><section class="aside-section interest"><div class="eyebrow">我理解的你的关注点</div><h2>关注，从阅读中延伸</h2>${personal.length?`<div class="rich">${personal.map(s=>s.html).join('')}</div>`:'<p>当前归档尚未包含关注点。个人关注点暂未载入。</p>'}${DATA.profile?`<details style="margin-top:12px"><summary>兴趣档案及权重</summary><div class="rich"><span class="private-slot" data-private="${DATA.profile}">需密码查看</span></div></details>`:''}</section><section class="aside-section"><div class="aside-heading"><h2>本周趋势</h2><a class="small-link" href="#/weekly">查看 ↗</a></div><p class="small-link" style="margin-top:12px">${DATA.archives.some(a=>a.weekly)?'周报已收录，回看一周变化。':'周末回看一周变化。当前归档中尚无周报，收录后将在这里呈现。'}</p></section></aside>`}
function story(entry,index){const title=entry.headline;return `<article class="story"><span class="ordinal" aria-hidden="true">${String(index+1).padStart(2,'0')}</span><div><div class="story-tags">${entry.tags.map(t=>`<span>${esc(t)}</span>`).join('<span aria-hidden="true">/</span>')||'<span>综合观察</span>'}</div>${/待换|待核|未经证实|聚合站/.test(entry.text)?'<span class="notice">来源待核实 · 原文标注</span>':''}${title?`<h3>${esc(title)}</h3>`:''}<div class="story-body rich">${entry.body_html}</div></div></article>`}
function home(doc){
 if(!doc){main.innerHTML=hero('每日情报','等待第一期远望','归档目录中尚无内容。')+empty('尚无日报','内容更新并重新构建后，即可在此阅读。');return}
 const daily=entries(doc,'今日要点');const archived=doc!==DATA.archives.find(a=>!a.weekly);
 const meta=`<div class="date-line"><span class="status"><i class="dot" aria-hidden="true"></i>${archived?'归档阅读':'最新一期'}</span><span class="divider"></span><time datetime="${esc(doc.date)}">${dateLabel(doc.date)}</time><span class="divider"></span><span>${daily.length} 条要点 · ${DATA.topics.length} 个长期议题</span></div>`;
 main.innerHTML=hero('每日情报 / 由近及远','读懂变化，找到自己的坐标。',plain(doc.summary),meta)+`<div class="layout"><div><section aria-labelledby="daily-heading"><div class="section-top"><h2 id="daily-heading">今日要点</h2>${archived?'<a class="view-latest" href="#/">返回最新一期 ↗</a>':'<span class="meta">事实、影响与关联，一起看</span>'}</div>${filters()}<div id="daily-stories"></div></section>${doc.sections.filter(s=>!s.title.includes('今日要点')&&!s.title.includes('关注点')).map(s=>`<section class="section-block"><div class="section-top"><h2>${esc(s.title)}</h2>${s.title.includes('探索')?'<span class="meta">再向前多看一步</span>':''}</div><div class="${s.title.includes('探索')?'':'supplement rich'}">${s.title.includes('探索')?s.entries.map(e=>`<div class="explore-item"><div class="rich">${e.headline?`<h3 style="margin:0 0 8px;font-size:16px">${esc(e.headline)}</h3>`:''}${e.body_html}</div></div>`).join(''):s.html}</div></section>`).join('')}${sourceDetails(doc)}</div>${aside()}</div>`;
 function draw(){const visible=daily.map((e,i)=>[e,i]).filter(([e])=>activeDomain==='全部'||e.tags.includes(activeDomain));$('#daily-stories').innerHTML=visible.length?(activeDomain==='全部'?[...DATA.domains,'综合观察'].map(d=>{const group=visible.filter(([e])=>(e.tags[0]||'综合观察')===d);return group.length?`<h3 class="domain-heading">${esc(d)}</h3>`+group.map(([e,i])=>story(e,i)).join(''):''}).join(''):visible.map(([e,i])=>story(e,i)).join('')):empty('该领域暂无要点','可以切换其他领域，或阅读下方补充与探索。')}
 wireFilters(draw);draw();
}
function wireFilters(draw){document.querySelectorAll('[data-domain]').forEach(b=>b.addEventListener('click',()=>{activeDomain=b.dataset.domain;document.querySelectorAll('[data-domain]').forEach(x=>x.setAttribute('aria-pressed',x===b));draw()}))}
function archiveRow(a){return `<a class="archive-row" href="${url('issue',a.id)}"><time datetime="${esc(a.date)}">${esc(a.date)}</time><div><h2>${esc(a.title)}${a.weekly?'<span class="badge">周报</span>':''}</h2><p>${esc(plain(a.summary))}</p><div class="archive-tags">${a.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div></div><span class="arrow" aria-hidden="true">↗</span></a>`}
function archivePage(weekly=false){main.innerHTML=hero(weekly?'每周回望 / 看见脉络':'情报档案 / 持续积累',weekly?'把一天的变化，放回一周里。':'每一期，都是观察的切片。',weekly?'阅读周末周报，梳理连续发生的变化与值得追踪的趋势。':'按日期回看每日情报，也可以从一个领域开始。')+`<section class="page-content"><div class="tools"><label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="search" type="search" placeholder="搜索标题、正文或日期" aria-label="搜索归档" value="${esc(search)}"></label></div>${filters()}<p id="result-count" class="filter-result" role="status"></p><div id="archive-results"></div></section>`;
 function draw(){const all=DATA.archives.filter(a=>!weekly||a.weekly);const items=all.filter(a=>(activeDomain==='全部'||a.tags.includes(activeDomain))&&a.raw.toLocaleLowerCase().includes(search.toLocaleLowerCase()));$('#result-count').textContent=`共 ${items.length} 期${weekly?'周报':'归档'}`;$('#archive-results').innerHTML=items.length?items.map(archiveRow).join(''):empty(all.length?'没有找到符合条件的内容':weekly?'周报尚未收录':'归档尚未收录',all.length?'试试其他关键词或领域。':weekly?'周末周报进入归档后，重新构建即可显示。':'日报进入归档后，重新构建即可显示。')}
 wireFilters(draw);$('#search').addEventListener('input',e=>{search=e.target.value;draw()});draw();
}
function topicsPage(){main.innerHTML=hero('长期议题 / 沿时间观察','让零散的消息，连成脉络。','记录同一议题在不同时间的进展，保留来源，让判断有迹可循。')+`<section class="page-content"><div class="section-top"><h2>正在追踪</h2><span class="meta">${DATA.topics.length} 个议题</span></div><div class="topic-grid">${DATA.topics.map(topicPreview).join('')}</div>${DATA.topics.length?'':empty('暂无议题','议题文件收录后将在这里呈现。')}</section>`}
function reportPage(doc){main.innerHTML=`<section class="hero"><a class="back" href="#/weekly">← 本周趋势</a><div class="eyebrow">周报 / ${esc(doc.date)}</div><h1>${esc(doc.title)}</h1></section><section class="page-content rich intro-rich">${doc.html}</section>${sourceDetails(doc)}`}
function topicPage(doc){main.innerHTML=`<section class="hero"><a class="back" href="#/topics">← 全部议题</a><div class="eyebrow">长期议题 / 时间线</div><h1>${esc(doc.title.replace(/^议题[：:]\s*/,''))}</h1><p class="lead">沿着时间，追踪每一次变化。以下内容按源文顺序呈现。</p></section><section class="page-content timeline rich">${doc.intro?`<p>${esc(doc.intro)}</p>`:''}${doc.sections.length?doc.sections.map(s=>`<h2>${esc(s.title)}</h2>${s.html}`).join(''):doc.html}</section>${sourceDetails(doc)}`}
function route(){activeDomain='全部';search='';let parts;try{parts=location.hash.slice(2).split('/').map(decodeURIComponent)}catch{parts=['missing']}
 const [page,id]=parts;let nav=page||'home';let title='今日情报';
 if(!page){home(DATA.archives.find(a=>!a.weekly))}
 else if(page==='archives'||page==='weekly'){archivePage(page==='weekly');title=page==='weekly'?'本周趋势':'往期归档'}
 else if(page==='topics'){topicsPage();title='议题追踪'}
 else if(page==='topic'&&DATA.topics.some(t=>t.id===id)){const doc=DATA.topics.find(t=>t.id===id);topicPage(doc);nav='topics';title=doc.title}
 else if(page==='issue'&&DATA.archives.some(t=>t.id===id)){const doc=DATA.archives.find(t=>t.id===id);if(doc.weekly)reportPage(doc);else home(doc);nav=doc.weekly?'weekly':'archives';title=doc.title}
 else{main.innerHTML=hero('页面未找到','这条观察路径暂不存在。','可通过上方导航返回最新情报或查看全部议题。')}
 document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===nav)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title=title+' · 远望点';window.scrollTo(0,0);
}
function themeLabel(){const t=document.documentElement.dataset.theme;$('#theme-label').textContent=t==='light'?'浅色':t==='dark'?'深色':'跟随系统';$('#theme').setAttribute('aria-label',`当前${$('#theme-label').textContent}，点击切换为${t==='light'?'深色':t==='dark'?'跟随系统':'浅色'}`)}
$('#theme').addEventListener('click',()=>{const old=document.documentElement.dataset.theme;const next=old==='light'?'dark':old==='dark'?'system':'light';if(next==='system')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=next;try{localStorage.setItem('yuanwang-theme',next)}catch{}themeLabel()});themeLabel();
const built=new Date(DATA.built);$('#build-info').textContent='页面生成于 '+new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Tokyo',dateStyle:'short',timeStyle:'short',hour12:false}).format(built)+'（东京） · 内容更新后需重新发布';
let privateBlocks=null, unlockGeneration=0;
function hydratePrivate(){
 if(!document.createTreeWalker)return;
 const walker=document.createTreeWalker(main,4);const texts=[];let node;
 while((node=walker.nextNode()))if(/YWPRIVATE[0-9]+END/.test(node.nodeValue))texts.push(node);
 for(const text of texts){
   const fragment=document.createDocumentFragment();let last=0;
   for(const match of text.nodeValue.matchAll(/YWPRIVATE[0-9]+END/g)){
     fragment.append(document.createTextNode(text.nodeValue.slice(last,match.index)));
     const slot=document.createElement('span');slot.className='private-slot';slot.dataset.private=match[0];slot.textContent='需密码查看';fragment.append(slot);last=match.index+match[0].length;
   }
   fragment.append(document.createTextNode(text.nodeValue.slice(last)));text.replaceWith(fragment);
 }
 if(privateBlocks)main.querySelectorAll('[data-private]:not([data-open])').forEach(slot=>{
   const block=privateBlocks[slot.dataset.private];if(!block)return;
   slot.dataset.open='true';
   if(slot.closest('pre'))slot.textContent=block.raw;else slot.innerHTML=block.html;
 });
}
async function unlockPrivate(password,remember){
 const generation=++unlockGeneration;
 const status=$('#unlock-status'), submit=$('#unlock-submit');submit.disabled=true;status.textContent='正在解锁…';
 try{
   if(!globalThis.crypto?.subtle)throw new Error('unsupported');
   const envelope=DATA.encrypted;
   const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
   const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
   const key=await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:bytes(envelope.salt),iterations:envelope.iterations},material,{name:'AES-GCM',length:256},false,['decrypt']);
   const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(envelope.iv)},key,bytes(envelope.ciphertext));
   if(generation!==unlockGeneration)return;
   privateBlocks=JSON.parse(new TextDecoder().decode(plaintext));
   try{if(remember)sessionStorage.setItem('yuanwang-password',password);else sessionStorage.removeItem('yuanwang-password')}catch{}
   $('#private-password').value='';$('#unlock-label').textContent='个人化内容已解锁';$('#lock-content').hidden=false;
   status.textContent=remember?'已解锁，仅在本次会话记住密码。':'已解锁，刷新后需重新输入密码。';hydratePrivate();
 }catch(error){
   if(generation!==unlockGeneration)return;
   try{sessionStorage.removeItem('yuanwang-password')}catch{}
   status.textContent=error.message==='unsupported'?'当前浏览器不支持安全解密，请使用 HTTPS 或 localhost 打开。':'密码不正确，请重新输入。';
 }finally{submit.disabled=false}
}
$('#unlock-form').addEventListener('submit',event=>{event.preventDefault();unlockPrivate($('#private-password').value,$('#remember-password').checked)});
$('#lock-content').addEventListener('click',()=>{
 unlockGeneration++;privateBlocks=null;try{sessionStorage.removeItem('yuanwang-password')}catch{}
 $('#private-password').value='';$('#remember-password').checked=false;$('#lock-content').hidden=true;$('#unlock-label').textContent='解锁个人化内容';$('#unlock-status').textContent='已锁定。';route();hydratePrivate();
});
if(typeof MutationObserver!=='undefined')new MutationObserver(hydratePrivate).observe(main,{childList:true,subtree:true});
try{const saved=sessionStorage.getItem('yuanwang-password');if(saved){$('#remember-password').checked=true;unlockPrivate(saved,true)}}catch{}
window.addEventListener('hashchange',()=>{route();main.focus({preventScroll:true})});route();hydratePrivate();
</script>
